[package]
name = "mequa_launcher"
version = "0.1.0"
edition = "2021"
description = "Native launcher for the Mequa dashboard"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
